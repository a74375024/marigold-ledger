name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash tools/hygiene.sh

  host:
    name: host (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            sanitize: address,undefined
            type: Debug
          - name: tsan
            sanitize: thread
            type: Debug
          - name: release
            sanitize: ""
            type: Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DMARIGOLD_SANITIZE="${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Test
        env:
          # TSan needs a fixed memory layout on recent kernels.
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "${{ matrix.sanitize }}" = "thread" ]; then
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

  # Wikipedia's US TV-market and station lists, read at most once a week and
  # built into the apps (a TV never contacts Wikipedia). A failed read keeps
  # the last good data; only fresh data is saved.
  wikidata:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.week.outputs.key }}
      directory: ${{ steps.week.outputs.directory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: This week
        id: week
        run: |
          echo "key=wikidata-v1-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          # Made again each week, and whenever the code that makes it changes.
          code="${{ hashFiles('src/core/catalog/directory.cpp', 'src/core/catalog/directory_sources.cpp', 'src/core/logos/logos.cpp', 'tools/channeldir/channeldir.cpp') }}"
          echo "directory=channeldir-v7-$(date -u +%G-W%V)-${code:0:12}" >> "$GITHUB_OUTPUT"
      - name: This week's data, if read already
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ steps.week.outputs.key }}
          restore-keys: wikidata-v1-
      - name: Read Wikipedia (once a week)
        id: read
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build-wiki -DCMAKE_BUILD_TYPE=Release -DMARIGOLD_BUILD_TESTS=OFF -DMARIGOLD_BUILD_PREVIEW=ON
          cmake --build build-wiki --target marigold-wikidata --parallel "$(nproc)"
          mkdir -p data
          if ./build-wiki/tools/wikidata/marigold-wikidata data/wiki-data.new.json; then
            mv data/wiki-data.new.json data/wiki-data.json
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ -f data/wiki-data.json ]; then
            echo "::warning::Wikipedia couldn't be read; the apps keep the last data"
          else
            echo "::error::Wikipedia couldn't be read and there is no earlier data"
            exit 1
          fi
      - name: Keep this week's data
        if: steps.read.outputs.fresh == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ steps.week.outputs.key }}
      # The channel directory (catalog/directory.hpp): Wikipedia's channel
      # lists, their articles' redirects and Wikidata facts, iptv-org for the
      # channels listed, and the fallback logos. My Lineup depends on it, so
      # a directory that couldn't be made, or one much thinner than last
      # week's, leaves last week's in place; without any, the apps aren't
      # built.
      - name: This week's channel directory, if made already
        id: dircache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ steps.week.outputs.directory }}
          restore-keys: |
            channeldir-v7-
            channeldir-v6-
      - name: Make the channel directory (once a week)
        id: dirread
        if: steps.dircache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build-wiki -DCMAKE_BUILD_TYPE=Release -DMARIGOLD_BUILD_TESTS=OFF -DMARIGOLD_BUILD_PREVIEW=ON
          cmake --build build-wiki --target marigold-channeldir --parallel "$(nproc)"
          mkdir -p data
          last=()
          [ -f data/channel-directory.json ] && last=(data/channel-directory.json)
          rc=0
          ./build-wiki/tools/channeldir/marigold-channeldir data/channel-directory.new.json "${last[@]}" || rc=$?
          if [ "$rc" = 0 ]; then
            mv data/channel-directory.new.json data/channel-directory.json
            echo "keep=true" >> "$GITHUB_OUTPUT"
          elif [ ${#last[@]} -gt 0 ]; then
            if [ "$rc" = 3 ]; then
              echo "::warning::This week's channel directory is much thinner than last week's (see the log); the apps keep last week's"
              echo "keep=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The channel directory couldn't be made; the apps keep last week's"
            fi
          else
            echo "::error::The channel directory couldn't be made and there is no earlier one"
            exit 1
          fi
      - name: Keep this week's channel directory
        if: steps.dirread.outputs.keep == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ steps.week.outputs.directory }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('data/channel-directory.json') != ''
        with:
          name: channel-directory-${{ github.run_number }}
          path: data/channel-directory.json
          retention-days: 7

  webos:
    runs-on: ubuntu-24.04
    env:
      MARIGOLD_REQUIRE_CHANNEL_DIRECTORY: "1"  # cmake/channel-directory.cmake
    needs: [hygiene, host, wikidata]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Built-in Wikipedia data
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ needs.wikidata.outputs.key }}
          restore-keys: wikidata-v1-
          fail-on-cache-miss: true
      - name: Built-in channel directory
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ needs.wikidata.outputs.directory }}
          restore-keys: |
            channeldir-v7-
            channeldir-v6-
          fail-on-cache-miss: true
      - name: SDK cache key
        id: sdk
        run: echo "key=webos-sdk-$(sha256sum tools/sdk.conf | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/sdk
          key: ${{ steps.sdk.outputs.key }}
      - name: Fetch SDK
        run: echo "MARIGOLD_SDK=$(bash tools/fetch-sdk.sh ~/sdk)" >> "$GITHUB_ENV"
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build, check ABI and package
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/build-webos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-build-${{ github.run_number }}
          path: build-webos/ipk/*.ipk
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    env:
      MARIGOLD_REQUIRE_CHANNEL_DIRECTORY: "1"  # cmake/channel-directory.cmake
    needs: [hygiene, host, wikidata]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Built-in Wikipedia data
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ needs.wikidata.outputs.key }}
          restore-keys: wikidata-v1-
          fail-on-cache-miss: true
      - name: Built-in channel directory
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ needs.wikidata.outputs.directory }}
          restore-keys: |
            channeldir-v7-
            channeldir-v6-
          fail-on-cache-miss: true
      - name: Java 17 (the runner's)
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install the NDK and CMake the build pins
        run: >
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      # Without a release key, builds are signed with one debug key kept here,
      # so each build installs over the last (a new key would need an uninstall).
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.android/debug.keystore
          key: android-debug-key-v1
      - name: Release key (if the repository has one)
        env:
          KEYSTORE_B64: ${{ secrets.MARIGOLD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MARIGOLD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
          MARIGOLD_KEYSTORE_PASSWORD: ${{ secrets.MARIGOLD_KEYSTORE_PASSWORD }}
          MARIGOLD_KEY_ALIAS: ${{ secrets.MARIGOLD_KEY_ALIAS }}
          MARIGOLD_KEY_PASSWORD: ${{ secrets.MARIGOLD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain --no-daemon
      - name: Check the JNI calls on both sides
        run: python3 tools/android-jni-check.py android/app/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "marigold-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-android-${{ github.run_number }}
          path: marigold-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  # The Apple TV app: the host tests again with Apple's compiler, an unsigned
  # .ipa for a signing service to install, and a start in the tvOS Simulator.
  # On an Apple Silicon Mac (Build 133): the Intel ones stopped picking the
  # job up (Builds 131-132 cancelled after 15 minutes without a runner).
  # The scripts work on either; the app is built for the Apple TV's arm64
  # and the Simulator's slice matches the Mac.
  tvos:
    # Intel Macs (Build 157): GitHub's Apple Silicon Macs (macos-15) were
    # out of capacity for days, the jobs cancelled before a Mac took them.
    # The apps are the same: the device build is always arm64, the simulator
    # follows this Mac (build-tvos.sh), and the Mac app is universal.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MARIGOLD_REQUIRE_CHANNEL_DIRECTORY: "1"  # cmake/channel-directory.cmake
    needs: [hygiene, host, wikidata]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Built-in Wikipedia data
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ needs.wikidata.outputs.key }}
          restore-keys: wikidata-v1-
          fail-on-cache-miss: true
      - name: Built-in channel directory
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ needs.wikidata.outputs.directory }}
          restore-keys: |
            channeldir-v7-
            channeldir-v6-
          fail-on-cache-miss: true
      - name: Host tests with Apple clang
        # Compiles at most one per core: these Macs have 3 cores and 7 GB,
        # and an uncapped build ran ~100 compilers at once and crawled for
        # an hour (Build 133). The step stops itself rather than wait 6 hours.
        timeout-minutes: 45
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Debug -DMARIGOLD_SANITIZE="address,undefined"
          cmake --build build-host --parallel "$(sysctl -n hw.ncpu)"
          ctest --test-dir build-host --output-on-failure
      - name: Build marigold-preview (Live Events from a channel report)
        run: |
          cmake -S . -B build-preview -DCMAKE_BUILD_TYPE=Release -DMARIGOLD_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-preview --target marigold-preview --parallel "$(sysctl -n hw.ncpu)"
          mkdir -p marigold-preview-mac
          cp build-preview/tools/preview/marigold-preview tools/preview/README.md marigold-preview-mac/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-preview-mac-${{ github.run_number }}
          path: marigold-preview-mac
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/marigold-tvvlckit
          key: tvvlckit-${{ hashFiles('tools/tvos.conf') }}
      - name: Build the app
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/build-tvos.sh device
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-tvos-${{ github.run_number }}
          path: build-tvos/marigold-tvos-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Start it in the tvOS Simulator
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/tvos-smoke.sh "$(bash tools/build-tvos.sh simulator | tail -n 1)"

  # The Mac app: Apple Silicon and Intel in one, signed ad hoc, as a .dmg;
  # then started on this Mac, where it must draw, take keys, play a test file
  # with its VLC and quit cleanly (tools/mac-smoke.sh). Its own job, beside
  # the Apple TV's, so neither waits on the other.
  mac:
    runs-on: macos-15-intel  # see tvos
    timeout-minutes: 90
    env:
      MARIGOLD_REQUIRE_CHANNEL_DIRECTORY: "1"  # cmake/channel-directory.cmake
    needs: [hygiene, host, wikidata]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Built-in Wikipedia data
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/wiki-data.json
          key: ${{ needs.wikidata.outputs.key }}
          restore-keys: wikidata-v1-
          fail-on-cache-miss: true
      - name: Built-in channel directory
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/channel-directory.json
          key: ${{ needs.wikidata.outputs.directory }}
          restore-keys: |
            channeldir-v7-
            channeldir-v6-
          fail-on-cache-miss: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/marigold-vlckit-mac
          key: vlckit-mac-${{ hashFiles('tools/mac.conf') }}
      - name: Build the app
        timeout-minutes: 60
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/build-mac.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-mac-${{ github.run_number }}
          path: build-mac/marigold-mac-${{ github.run_number }}.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Start it on this Mac
        timeout-minutes: 5
        run: bash tools/mac-smoke.sh build-mac/src/platform/macos/Marigold.app

  # A new version (project() in CMakeLists.txt) built on master: its release,
  # the four apps as direct downloads under the same names every time (so
  # .../releases/latest/download/<name> always gets the newest). Later builds
  # of the same version make none.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [webos, android, tvos, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Release, if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(marigold VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          tag="v${version:?no version in CMakeLists.txt}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is released already"
            exit 0
          fi
          for name in build android tvos mac; do
            gh run download "$GITHUB_RUN_ID" -n "marigold-$name-$RUN" -D "dl/$name"
          done
          mkdir out
          cp dl/build/*.ipk out/marigold-lg-webos.ipk
          cp dl/android/*.apk out/marigold-android.apk
          cp dl/tvos/*.ipa out/marigold-apple-tv.ipa
          cp dl/mac/*.dmg out/marigold-mac.dmg
          ls -l out
          gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Marigold ${version%.0}" --notes ""
