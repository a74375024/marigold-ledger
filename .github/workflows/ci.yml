name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash tools/hygiene.sh

  host:
    name: host (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            sanitize: address,undefined
            type: Debug
          - name: tsan
            sanitize: thread
            type: Debug
          - name: release
            sanitize: ""
            type: Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DMARIGOLD_SANITIZE="${{ matrix.sanitize }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          # TSan needs a fixed memory layout on recent kernels.
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "${{ matrix.sanitize }}" = "thread" ]; then
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

  webos:
    runs-on: ubuntu-24.04
    needs: [hygiene, host]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: SDK cache key
        id: sdk
        run: echo "key=webos-sdk-$(sha256sum tools/sdk.conf | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/sdk
          key: ${{ steps.sdk.outputs.key }}
      - name: Fetch SDK
        run: echo "MARIGOLD_SDK=$(bash tools/fetch-sdk.sh ~/sdk)" >> "$GITHUB_ENV"
      - name: Install tools
        run: sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build, check ABI and package
        env:
          MARIGOLD_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/build-webos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marigold-build-${{ github.run_number }}
          path: build-webos/ipk/*.ipk
          if-no-files-found: error
          retention-days: 30
